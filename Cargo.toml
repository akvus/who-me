[package]
name = "who-me"
version = "0.1.0"
edition = "2024"
description = "A beautiful terminal dashboard for the different parts of who you are"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tui-scrollview = "0.6.7"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
